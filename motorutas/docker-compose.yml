services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: motorutas
      POSTGRES_PASSWORD: motorutas
      POSTGRES_DB: motorutas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motorutas"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://motorutas:motorutas@postgres:5432/motorutas
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-change-in-production
      CORS_ORIGINS: http://localhost:4321,http://127.0.0.1:4321
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4321:4321"
    environment:
      PUBLIC_API_URL: http://localhost:8000
      PUBLIC_WS_URL: ws://localhost:8000
      PUBLIC_MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
